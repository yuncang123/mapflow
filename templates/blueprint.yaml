# Mapflow schema 3 Blueprint 示例。Blueprint 是定义真源；实际使用时由用户级 runtime 保存到目标工作区之外的 Workspace Sidecar。
schema_version: 3
map_id: publish-article

intent:
  statement: 把已有素材变成一篇可以安全公开分享的文章
  status: shaped
  open_questions: []

destination:
  statement: 文章已公开发布且敏感内容已经检查
  requires:
    - article-published
    - public-url-exists
    - sensitive-content-checked
  invariants:
    - approval-before-publish
  acceptance:
    - id: public-page-readable
      proves: [article-published, public-url-exists]
      proof: 公开 URL 可以读取文章正文
    - id: sensitive-review-recorded
      proves: [sensitive-content-checked]
      proof: 检查记录能够回指候选稿

predicates:
  - id: source-exists
    fact: source-exists
    equals: "true"
    kind: state
  - id: audience-unknown
    fact: audience-known
    equals: unknown
    kind: state
  - id: audience-known
    fact: audience-known
    equals: "true"
    kind: state
  - id: article-drafted
    fact: article-drafted
    equals: "true"
    kind: state
  - id: sensitive-content-checked
    fact: sensitive-content-checked
    equals: "true"
    kind: state
  - id: owner-approved
    fact: owner-approved
    equals: "true"
    kind: authorization
  - id: article-published
    fact: article-published
    equals: "true"
    kind: state
  - id: public-url-exists
    fact: public-url-exists
    equals: "true"
    kind: state

initial_state:
  facts:
    - id: source-exists
      value: "true"
      evidence:
        - kind: document
          ref: notes/source.md
    - id: audience-known
      value: unknown
      evidence: []
    - id: article-drafted
      value: "false"
      evidence:
        - kind: observation
          ref: initial inspection
    - id: sensitive-content-checked
      value: "false"
      evidence:
        - kind: observation
          ref: initial inspection
    - id: owner-approved
      value: "false"
      evidence:
        - kind: observation
          ref: no approval receipt
    - id: article-published
      value: "false"
      evidence:
        - kind: observation
          ref: publication lookup
    - id: public-url-exists
      value: "false"
      evidence:
        - kind: observation
          ref: publication lookup

assumptions: []

invariants:
  - id: approval-before-publish
    applies_to: [publish-article]
    requires: [owner-approved]

boundaries:
  in_scope: [写作、审阅和发布路线]
  out_of_scope: [自动决定文章受众]
  authorization: [公开发布必须由 Owner 明确授权]

nodes:
  - id: material-present-audience-unknown
    kind: fog
    label: 素材存在，读者未知
    predicates: [source-exists, audience-unknown]
  - id: writing-ready
    kind: state
    label: 素材和读者已明确
    predicates: [source-exists, audience-known]
  - id: candidate-ready
    kind: join
    label: 候选稿与敏感检查均完成
    predicates: [article-drafted, sensitive-content-checked]
  - id: candidate-approved
    kind: state
    label: 候选稿已批准
    predicates: [article-drafted, sensitive-content-checked, owner-approved]
  - id: article-live
    kind: destination
    label: 文章已发布
    predicates: [article-published, public-url-exists, sensitive-content-checked]

edges:
  - id: settle-audience
    from: material-present-audience-unknown
    to: writing-ready
    brief_ref: briefs/settle-audience.md
    preconditions: [source-exists, audience-unknown]
    effects: [audience-known]
    invariants: []
    certainty: expected
    evidence_contract:
      - id: audience-decision-record
        proves: [audience-known]
        required: true
    causal_contract:
      rule_id: settle-audience-rule
      premises: [source-exists, audience-unknown]
      conclusions: [audience-known]
      proof_mode: executed-verifier
      rule_basis: { kind: verifier, ref: audience-record-check }
      required_witnesses: [audience-decision-record]
      non_interference: []
    on_failure:
      action: replan
  - id: write-candidate
    from: writing-ready
    to: candidate-ready
    brief_ref: briefs/write-candidate.md
    preconditions: [source-exists, audience-known]
    effects: [article-drafted, sensitive-content-checked]
    invariants: []
    certainty: expected
    evidence_contract:
      - id: candidate-and-review-record
        proves: [article-drafted, sensitive-content-checked]
        required: true
    causal_contract:
      rule_id: write-candidate-rule
      premises: [source-exists, audience-known]
      conclusions: [article-drafted, sensitive-content-checked]
      proof_mode: executed-verifier
      rule_basis: { kind: verifier, ref: candidate-review-check }
      required_witnesses: [candidate-and-review-record]
      non_interference: []
    on_failure:
      action: replan
  - id: obtain-owner-approval
    from: candidate-ready
    to: candidate-approved
    brief_ref: briefs/obtain-owner-approval.md
    preconditions: [article-drafted, sensitive-content-checked]
    effects: [owner-approved]
    invariants: []
    certainty: conditional
    evidence_contract:
      - id: owner-approval-receipt
        proves: [owner-approved]
        required: true
    causal_contract:
      rule_id: obtain-owner-approval-rule
      premises: [article-drafted, sensitive-content-checked]
      conclusions: [owner-approved]
      proof_mode: executed-verifier
      rule_basis: { kind: verifier, ref: owner-approval-readback }
      required_witnesses: [owner-approval-receipt]
      non_interference: []
    on_failure:
      action: stop
  - id: publish-article
    from: candidate-approved
    to: article-live
    brief_ref: briefs/publish-article.md
    preconditions: [article-drafted, sensitive-content-checked, owner-approved]
    effects: [article-published, public-url-exists]
    invariants: [approval-before-publish]
    certainty: expected
    evidence_contract:
      - id: publication-readback
        proves: [article-published, public-url-exists]
        required: true
    causal_contract:
      rule_id: publish-article-rule
      premises: [article-drafted, sensitive-content-checked, owner-approved]
      conclusions: [article-published, public-url-exists]
      proof_mode: executed-verifier
      rule_basis: { kind: verifier, ref: publication-readback }
      required_witnesses: [publication-readback]
      non_interference: [sensitive-content-checked, owner-approved]
    on_failure:
      action: replan

loops: []

submaps: []

extensions:
  x-owner: personal

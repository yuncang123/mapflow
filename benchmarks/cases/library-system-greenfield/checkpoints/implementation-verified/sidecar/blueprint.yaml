    fact: git-repository-exists
    equals: "true"
    kind: resource
  - id: local-node-runtime-available
    fact: local-node-runtime-available
    equals: "true"
    kind: resource
  - id: node-sqlite-available
    fact: node-sqlite-available
    equals: "true"
    kind: resource
  - id: destination-contract-confirmed
    fact: destination-contract-confirmed
    equals: "true"
    kind: authorization
  - id: production-dependencies-forbidden
    fact: production-dependencies-allowed
    equals: "false"

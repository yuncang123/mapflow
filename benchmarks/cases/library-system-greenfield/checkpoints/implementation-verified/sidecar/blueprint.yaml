schema_version: 2
map_id: shelfwise-v1

intent:
  statement: 从零开发 Shelfwise，供小型社区图书室管理员在本机完成日常借阅管理
  status: shaped
  open_questions: []

destination:
  statement: Shelfwise v1 已在本机提供可持久化、可验证的单管理员图书借阅闭环
  requires:
    - startup-and-page-verified
    - registration-workflows-verified
    - loan-lifecycle-verified
    - restart-persistence-verified
    - required-api-contract-verified
    - production-dependency-policy-verified
  invariants:
    - production-dependencies-remain-empty
    - configured-data-file-is-authoritative
    - no-external-release
  acceptance:
    - id: a1-startup-page
      proves:
        - startup-and-page-verified
      proof: 临时 PORT 和 LIBRARY_DATA_FILE 下 npm start 成功，GET / 返回可操作页面
    - id: a2-registration
      proves:
        - registration-workflows-verified
      proof: 页面和 API 可登记单册图书与读者并返回稳定 ID
    - id: a3-a4-loan-lifecycle
      proves:
        - loan-lifecycle-verified
      proof: 借阅、有效查询、归还和非法重复操作符合合同且不产生脏数据
    - id: a5-restart-persistence
      proves:
        - restart-persistence-verified
      proof: 使用同一数据文件重启后，图书、读者与借阅状态完全一致
    - id: a6-api-contract
      proves:
        - required-api-contract-verified
      proof: 自动化测试逐一调用页面入口和五个指定 API
    - id: a6-production-dependencies
      proves:
        - production-dependency-policy-verified
      proof: package.json 的生产 dependencies 为空且服务不依赖第三方包


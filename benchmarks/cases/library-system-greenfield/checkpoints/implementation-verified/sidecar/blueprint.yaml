  - id: configured-data-file-required
    fact: configured-data-file-required
    equals: "true"
    kind: state
  - id: external-release-not-authorized
    fact: external-deployment-authorized
    equals: "false"
    kind: authorization
  - id: persistent-library-api-ready
    fact: persistent-library-api-ready
    equals: "true"
    kind: state
  - id: admin-browser-workflows-ready
    fact: admin-browser-workflows-ready
    equals: "true"
    kind: state
  - id: startup-and-page-verified
    fact: startup-and-page-verified
    equals: "true"
    kind: state
  - id: registration-workflows-verified
    fact: registration-workflows-verified
    equals: "true"
    kind: state
  - id: loan-lifecycle-verified

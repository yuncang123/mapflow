assumptions: []

invariants:
  - id: production-dependencies-remain-empty
    applies_to:
      - build-persistent-library-api
      - build-admin-browser-interface
      - verify-shelfwise-v1
    requires:
      - production-dependencies-forbidden
  - id: configured-data-file-is-authoritative
    applies_to:
      - build-persistent-library-api
      - build-admin-browser-interface
      - verify-shelfwise-v1
    requires:
      - configured-data-file-required
  - id: no-external-release
    applies_to:
      - build-persistent-library-api
      - build-admin-browser-interface
      - verify-shelfwise-v1
    requires:
      - external-release-not-authorized

boundaries:
  in_scope:
    - 单管理员使用的图书、读者、借阅、归还和有效借阅查询
    - 本地浏览器管理页面、SQLite 文件持久化和对应自动化验证
  out_of_scope:
    - 会员收费、电子书、推荐、预约和多人权限
    - 外部部署、发布和外部系统写入
  authorization:
    - 每条工作边都需要独立人工施工授权
    - 仅允许本仓库写入、本机临时端口、临时数据文件和本机浏览器验证

nodes:
  - id: shelfwise-empty-repository
    kind: state
    label: Shelfwise 已定边界的空白仓库
    predicates:
      - git-repository-exists
      - local-node-runtime-available
      - node-sqlite-available
      - destination-contract-confirmed
      - production-dependencies-forbidden
      - configured-data-file-required
      - external-release-not-authorized
    realization_refs:
      - kind: git
        ref: commit:ab18d7bb31694a11c2874d2fb6a3d6600e3007f1
        strength: observed
  - id: library-api-ready
    kind: state
    label: 持久化图书借阅 API 已就绪
    predicates:
      - persistent-library-api-ready
  - id: admin-app-ready
    kind: join
    label: 管理员浏览器工作流已就绪
    predicates:
      - persistent-library-api-ready
      - admin-browser-workflows-ready
  - id: shelfwise-v1-ready
    kind: destination
    label: Shelfwise v1 合同已验证
    predicates:
      - startup-and-page-verified
      - registration-workflows-verified
      - loan-lifecycle-verified
      - restart-persistence-verified
      - required-api-contract-verified
      - production-dependency-policy-verified

edges:
  - id: build-persistent-library-api
    from: shelfwise-empty-repository
    to: library-api-ready
    brief_ref: briefs/build-persistent-library-api.md
    preconditions:
      - git-repository-exists
      - local-node-runtime-available
      - node-sqlite-available
      - destination-contract-confirmed
    effects:
      - persistent-library-api-ready
    invariants:
      - production-dependencies-remain-empty
      - configured-data-file-is-authoritative
      - no-external-release
    certainty: expected
    evidence_contract:
      - id: persistent-api-test-record
        proves:
          - persistent-library-api-ready
        required: true
    on_failure:
      action: replan
  - id: build-admin-browser-interface
    from: library-api-ready
    to: admin-app-ready
    brief_ref: briefs/build-admin-browser-interface.md
    preconditions:
      - persistent-library-api-ready
    effects:
      - admin-browser-workflows-ready
    invariants:
      - production-dependencies-remain-empty
      - configured-data-file-is-authoritative
      - no-external-release
    certainty: expected
    evidence_contract:
      - id: admin-browser-workflow-record
        proves:
          - admin-browser-workflows-ready
        required: true
    on_failure:
      action: replan
  - id: verify-shelfwise-v1
    from: admin-app-ready
    to: shelfwise-v1-ready
    brief_ref: briefs/verify-shelfwise-v1.md
    preconditions:
      - persistent-library-api-ready
      - admin-browser-workflows-ready
    effects:
      - startup-and-page-verified
      - registration-workflows-verified
      - loan-lifecycle-verified
      - restart-persistence-verified
      - required-api-contract-verified
      - production-dependency-policy-verified
    invariants:
      - production-dependencies-remain-empty
      - configured-data-file-is-authoritative
      - no-external-release
    certainty: expected
    evidence_contract:
      - id: shelfwise-v1-acceptance-record
        proves:
          - startup-and-page-verified
          - registration-workflows-verified
          - loan-lifecycle-verified
          - restart-persistence-verified
          - required-api-contract-verified
          - production-dependency-policy-verified
        required: true
    on_failure:
      action: replan

loops: []
submaps: []

extensions:
  x-prior-art: research/prior-art.md

destination:
  id: shelfwise-v1
  kind: destination
  label: Shelfwise v1 可用的本地图书借阅闭环
  statement: |-
    使用者：小型社区图书室管理员。
    目标 Predicate：管理员能在浏览器页面登记单册图书、登记读者、创建借阅、办理归还并查询当前有效借阅；借阅引用有效图书和读者，同一单册同一时刻至多一笔有效借阅；成功写入的数据经进程重启后仍从 LIBRARY_DATA_FILE 恢复；应用由当前本地 Node.js 运行，以 npm start 启动，监听 PORT，页面入口为 /；HTTP 合同包含 POST /api/books、POST /api/readers、POST /api/loans、POST /api/returns 和 GET /api/loans?status=active。
    验收：A1 使用临时 PORT 和 LIBRARY_DATA_FILE 执行 npm start 后，GET / 返回可操作页面；A2 经页面和 API 登记一本单册图书与一名读者并获得稳定 ID；A3 创建借阅后 active 查询返回关联图书和读者，重复借出同一单册或引用不存在记录时返回 4xx 且不产生脏数据；A4 归还后该借阅不再出现在 active 查询，重复或无效归还返回 4xx；A5 停止并以同一数据文件重启后，图书、读者及借阅状态保持一致；A6 自动化测试和代码检查证明上述 HTTP 合同且 package.json 没有第三方生产依赖。
    不变量：只在本机运行；使用 Node.js 内置能力实现生产路径；持久化文件由 LIBRARY_DATA_FILE 指定；失败请求不改变已确认数据；实现和验证不得发布或写入外部环境。
    范围内：单管理员使用的图书、读者、借阅、归还、有效借阅查询、浏览器管理页面、本地文件持久化和对应自动化验证。
    范围外：会员收费、电子书、推荐、预约、多人权限、外部部署与发布。
    授权边界：允许在本仓库实现并在本机使用临时端口和临时数据文件验证；不允许外部发布、生产部署或外部系统写入。
  status: confirmed
nodes:
  - id: library-api-ready
    kind: state
    label: 持久化图书借阅 API 已就绪
    purpose: 提供经过自动化验证的领域规则、文件持久化和指定 HTTP 合同
    status: confirmed
    facts:
      - id: persistent-library-api-ready
        value: 'true'
        evidence: []
    question_refs:
      - confirm-library-api-ready-node
    non_goals:
      - 不包含浏览器交互界面
    proof:
      status: confirmed-suffix
      summary: 人工已确认该状态；它可通过已确认的浏览器界面边与整体验收边抵达目的地
      evidence_refs:
        - kind: note
          ref: conversation-user-message-2026-09-07-library-api-node-confirmation
          strength: asserted
  - id: admin-app-ready
    kind: join
    label: 管理员浏览器工作流已就绪
    purpose: 在已验证 API 之上提供完整的单管理员浏览器操作闭环
    status: confirmed
    facts:

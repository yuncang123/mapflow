questions:
  - id: establish-starting-state
    prompt: 当前工作区已经成立、尚未确认或相互冲突的事实分别是什么？
    target:
      kind: node
      id: workspace-origin-fog
      label: 始发地仍在迷雾中
      purpose: 以四值事实和来源证据固定当前起始状态
    status: answered
    answer_updates:
      - wayfinding.intent.open_questions
    answer: 已勘探：仓库存在，但没有实现、测试或已确认的核心用户旅程
    evidence_refs:
      - kind: note
        ref: demo-establish-starting-state
  - id: shape-library-destination
    prompt: 第一版必须完成哪些可观察结果，明确排除什么？
    target:
      kind: destination
      id: workspace-destination-fog
      label: 图书管理 MVP 目的地尚未定形
      purpose: 收敛目标 Predicate、验收、非目标和授权边界
    status: answered
    answer_updates:
      - wayfinding.destination
      - wayfinding.boundaries
    answer: 必须完成新增、搜索、借出、归还并通过自动检查和人工演示；排除多用户、云同步、推荐和部署
    evidence_refs:
      - kind: note
        ref: demo-shape-library-destination
  - id: confirm-library-destination
    prompt: 是否明确确认这份目的地 Predicate、验收和非目标合同？
    target:
      kind: destination
      id: workspace-destination-fog
      label: 图书管理 MVP 目的地尚未定形
      purpose: 由人确认目的地，允许开始反向目标回归
    status: answered
    answer_updates:
      - wayfinding.intent.status
      - wayfinding.destination.status
    answer: 我确认并批准这份图书管理 MVP 目的地合同
    evidence_refs:
      - kind: note
        ref: demo-confirm-library-destination
  - id: confirm-mvp-integrated-node
    prompt: 是否确认“两个切片已集成并通过自动检查”是目的地之前独立可验收的里程碑？
    target:
      kind: node
      id: mvp-integrated
      label: 两个切片已集成并通过自动检查
      purpose: 确认最近的反向里程碑
    status: answered
    answer_updates:
      - wayfinding.nodes.mvp-integrated.status
    answer: 我确认这个里程碑独立、必要且可验收
    evidence_refs:
      - kind: note
        ref: demo-confirm-mvp-integrated-node
  - id: confirm-accept-library-edge
    prompt: 是否确认这条演示验收边的范围、非目标和证据合同？
    target:
      kind: edge
      id: accept-library-mvp
      label: 按核心旅程演示并验收
      purpose: 确认到达目的地的最后一条独立工作边
    status: answered
    answer_updates:
      - wayfinding.edges.accept-library-mvp.status
    answer: 我确认这条边独立、边界明确且可回读验收
    evidence_refs:
      - kind: note
        ref: demo-confirm-accept-library-edge
  - id: confirm-independent-slices-join
    prompt: 是否确认目录与借还必须作为两条互不消费对方输出的分支，并在 AND 状态汇合？
    target:
      kind: node
      id: independent-slices-ready
      label: 目录与借还两个独立切片均就绪
      purpose: 确认并行分支的 AND 汇合语义
    status: answered
    answer_updates:
      - wayfinding.nodes.independent-slices-ready.status
    answer: 我确认两个切片必须独立完成，缺一不可，且彼此没有隐藏产出依赖
    evidence_refs:
      - kind: note
        ref: demo-confirm-independent-slices-join
  - id: confirm-integrate-library-edge
    prompt: 是否确认集成边只消费两个切片的可验收出口，不回写或扩大分支合同？
    target:
      kind: edge
      id: integrate-library-slices
      label: 集成并自动验证两个切片
      purpose: 确认 AND Join 之后的集成工作边
    status: answered
    answer_updates:
      - wayfinding.edges.integrate-library-slices.status
    answer: 我确认集成边只在两条分支都完成后执行
    evidence_refs:
      - kind: note
        ref: demo-confirm-integrate-library-edge
  - id: confirm-engineering-design-reviewed-node
    prompt: 是否确认“工程设计文档已评审并冻结为实施输入”是所有编码工作的必要前置里程碑？
    target:
      kind: node
      id: engineering-design-reviewed
      label: 工程设计文档已评审并冻结为实施输入
      purpose: 确认代码开工前的设计评审门
    status: answered
    answer_updates:
      - wayfinding.nodes.engineering-design-reviewed.status
    answer: 我确认没有这项设计评审就不能开始编码
    evidence_refs:
      - kind: note
        ref: demo-confirm-engineering-design-reviewed-node
  - id: confirm-engineering-design-join
    prompt: 是否确认领域模型和 API / 持久化契约是两条独立设计路径，缺一不可且不消费对方未声明的产出？
    target:
      kind: node
      id: engineering-design-ready
      label: 领域模型与 API / 持久化契约均已形成
      purpose: 确认代码开工前的设计文档网络
    status: answered
    answer_updates:
      - wayfinding.nodes.engineering-design-ready.status
    answer: 我确认两份设计文档可以独立形成，之后在 AND 汇合
    evidence_refs:
      - kind: note
        ref: demo-confirm-engineering-design-join
  - id: confirm-design-domain-model-edge
    prompt: 是否确认领域模型设计边只产出领域模型文档，不偷带 API 或代码实现？
    target:
      kind: edge
      id: design-domain-model
      label: 形成领域模型设计
      purpose: 确认第一条设计子路径
    status: answered
    answer_updates:
      - wayfinding.edges.design-domain-model.status
    answer: 我确认领域模型文档有独立出口，不包含 API 实现
    evidence_refs:
      - kind: note
        ref: demo-confirm-design-domain-model-edge
  - id: confirm-design-api-contract-edge
    prompt: 是否确认 API 与持久化契约边可以独立形成，并不消费领域模型边的隐藏产出？
    target:
      kind: edge
      id: design-api-contract
      label: 形成 API 与持久化契约
      purpose: 确认第二条设计子路径
    status: answered
    answer_updates:
      - wayfinding.edges.design-api-contract.status
    answer: 我确认 API 与持久化契约有独立出口，与领域模型设计互不隐藏耦合
    evidence_refs:
      - kind: note
        ref: demo-confirm-design-api-contract-edge
  - id: confirm-review-engineering-design-edge
    prompt: 是否确认设计评审边只消费两份独立设计文档，并以评审记录作为编码前置证据？
    target:
      kind: edge
      id: review-engineering-design
      label: 评审并冻结工程设计文档
      purpose: 确认设计子图的 AND 汇合出口
    status: answered
    answer_updates:
      - wayfinding.edges.review-engineering-design.status
    answer: 我确认这条评审边必须等两份文档都存在且一致
    evidence_refs:
      - kind: note
        ref: demo-confirm-review-engineering-design-edge
  - id: confirm-core-journey-node
    prompt: 是否确认“核心用户旅程已确认”是实施前必要的阶段性节点？
    target:
      kind: node
      id: core-journey-confirmed
      label: 核心用户旅程已确认
      purpose: 确认实施的输入里程碑
    status: answered
    answer_updates:
      - wayfinding.nodes.core-journey-confirmed.status
    answer: 我确认这个里程碑能够约束实施范围
    evidence_refs:
      - kind: note
        ref: demo-confirm-core-journey-node
  - id: confirm-build-catalog-edge
    prompt: 是否确认目录分支只实现新增与搜索，并拥有不依赖借还分支的出口证据？
    target:
      kind: edge
      id: build-catalog-slice
      label: 构建目录与搜索切片
      purpose: 确认第一条独立分支
    status: answered
    answer_updates:
      - wayfinding.edges.build-catalog-slice.status
    answer: 我确认目录分支有独立出口，不消费借还分支的输出
    evidence_refs:
      - kind: note
        ref: demo-confirm-build-catalog-edge
  - id: confirm-build-circulation-edge
    prompt: 是否确认借还分支只实现借出与归还，并拥有不依赖目录分支实现输出的出口证据？
    target:
      kind: edge
      id: build-circulation-slice
      label: 构建借还生命周期切片
      purpose: 确认第二条独立分支
    status: answered
    answer_updates:
      - wayfinding.edges.build-circulation-slice.status
    answer: 我确认借还分支与目录分支共享的只有共同起始状态
    evidence_refs:
      - kind: note
        ref: demo-confirm-build-circulation-edge
  - id: confirm-core-journey-edge
    prompt: 是否确认这条边只产生旅程决定，不偷偷包含实现工作？
    target:
      kind: edge
      id: confirm-core-journey
      label: 确认核心用户旅程
      purpose: 闭合从始发地到目的地的候选链
    status: answered
    answer_updates:
      - wayfinding.edges.confirm-core-journey.status
    answer: 我确认这条边只产生旅程决定，候选链可以闭合
    evidence_refs:
      - kind: note
        ref: demo-confirm-core-journey-edge

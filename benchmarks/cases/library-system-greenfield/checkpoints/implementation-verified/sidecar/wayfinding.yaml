schema_version: 1
phase: regression
intent:
  statement: 为个人藏书开发一个可验收的本地管理系统
  status: shaped
  open_questions: []
origin:
  id: workspace-origin-fog
  kind: fog
  label: 仓库存在，核心旅程和实现仍在迷雾中
  facts:
    - id: repository-present
      value: 'true'
      evidence:
        - kind: git
          ref: empty demo repository
    - id: core-journey-known
      value: unknown
      evidence: []
    - id: implementation-present
      value: 'false'
      evidence:
        - kind: observation
          ref: workspace contains README only
destination:
  id: workspace-destination-fog
  kind: destination
  label: MVP 已通过完整核心旅程验收
  statement: 个人能够管理自己的藏书
  status: confirmed
  requires:
    - engineering-design-reviewed
    - catalog-slice-ready
    - circulation-slice-ready
    - integration-tests-pass
    - demo-accepted
  invariants:
    - no-external-release
  acceptance:
    - id: catalog-slice-accepted
      proves:
        - catalog-slice-ready
      proof: 新增与搜索拥有独立自动检查
    - id: engineering-design-accepted
      proves:
        - engineering-design-reviewed
      proof: 领域模型与 API / 持久化契约已经分别评审并汇合
    - id: circulation-slice-accepted
      proves:
        - circulation-slice-ready
      proof: 借出与归还拥有独立自动检查
    - id: library-integration-accepted
      proves:
        - integration-tests-pass
      proof: 两个切片汇合后通过跨切片检查
    - id: library-demo-accepted
      proves:
        - demo-accepted
      proof: Owner 按完整核心旅程完成回读
boundaries:
  in_scope:
    - 新增与搜索切片
    - 借出与归还切片
    - 本地集成与人工演示
  out_of_scope:
    - 多用户权限
    - 云同步
    - 推荐算法
    - 生产部署
  authorization:
    - 每条工作边单独获得 Owner 授权
nodes:
  - id: mvp-integrated
    kind: state
    label: 两个切片已集成并通过自动检查
    purpose: 固定人工演示之前的集成出口
    status: confirmed
  - id: independent-slices-ready
    kind: join
    label: 目录与借还两个独立切片均就绪
    purpose: 只有两个分支 Predicate 都成立时才允许集成
    status: confirmed
  - id: engineering-design-reviewed
    kind: state
    label: 工程设计文档已评审并冻结为实施输入
    purpose: 只有设计合同评审通过后才开放编码
    status: confirmed
  - id: engineering-design-ready
    kind: join
    label: 领域模型与 API / 持久化契约均已形成
    purpose: 两个独立设计子目的地的 AND 汇合
    status: confirmed
  - id: core-journey-confirmed
    kind: state
    label: 核心用户旅程已确认
    purpose: 防止实现范围漂移
    status: confirmed
edges:
  - id: accept-library-mvp
    from: mvp-integrated
    to: workspace-destination-fog
    label: 按核心旅程演示并验收
    purpose: 建立里程碑“按核心旅程演示并验收”并留下可回读出口
    status: confirmed
    brief_ref: briefs/accept-library-mvp.md
    preconditions:
      - catalog-slice-ready
      - circulation-slice-ready
      - integration-tests-pass
    effects:
      - demo-accepted
    invariants:
      - scope-preserved
    evidence_contract:
      - id: accept-library-mvp-record
        proves:
          - demo-accepted
        required: true
        proof: 检查和结果可回读
    acceptance:
      - id: library-demo-accepted
        proves:
          - demo-accepted
        proof: 阶段出口可回读
    non_goals:
      - 不扩大到已声明非目标
    certainty: expected
    on_failure:
      action: replan
      scope: edge:accept-library-mvp
    proof:
      status: logical
      summary: 在当前显式条件下目标后缀可达
      missing: []
      evidence_refs: []
  - id: integrate-library-slices
    from: independent-slices-ready
    to: mvp-integrated
    label: 集成并自动验证两个切片
    purpose: 建立里程碑“集成并自动验证两个切片”并留下可回读出口
    status: confirmed
    brief_ref: briefs/integrate-library-slices.md
    preconditions:
      - catalog-slice-ready
      - circulation-slice-ready
    effects:
      - integration-tests-pass
    invariants:
      - scope-preserved
    evidence_contract:
      - id: integrate-library-slices-record
        proves:
          - integration-tests-pass
        required: true
        proof: 检查和结果可回读
    acceptance:

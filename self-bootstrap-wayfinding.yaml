    kind: state
    label: 默认产品表面只表达 Mapflow 主链
    purpose: 清除偏航机制并统一五层证据语义
    status: confirmed
    non_goals: [不删除旧状态的兼容读取]
    acceptance: [{ id: core-surface-audit, proves: [default-product-core-only], proof: 核心表面审计通过 }]
    proof: { status: candidate, summary: 可由静态契约测试观察, missing: [等待执行], evidence_refs: [] }

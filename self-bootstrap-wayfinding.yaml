    brief_ref: briefs/run-deterministic-regression.md
    preconditions: [default-product-core-only]
    effects: [full-regression-passes]
    invariants: [evidence-never-overclaims, target-workspaces-remain-unmodified]
    evidence_contract: [{ id: deterministic-regression, proves: [full-regression-passes], required: true, proof: npm test 退出码为零 }]
    causal_contract: { rule_id: deterministic-regression-rule, premises: [default-product-core-only], conclusions: [full-regression-passes] }
    acceptance: [{ id: deterministic-regression, proves: [full-regression-passes], proof: 完整测试通过 }]
    non_goals: [不等同于发布验收]

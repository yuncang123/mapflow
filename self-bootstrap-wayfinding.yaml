    kind: state
    label: 确定性回归全部通过
    purpose: 证明精简没有破坏推导、执行、回放和证据边界
    status: confirmed
    non_goals: [不把本地回归称为发布或生产验收]
    acceptance: [{ id: deterministic-regression, proves: [full-regression-passes], proof: npm test 退出码为零 }]
    proof: { status: candidate, summary: 核心表面对齐后运行完整回归, missing: [等待执行], evidence_refs: [] }

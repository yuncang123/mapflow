schema_version: 1
phase: regression
intent:
  statement: 让 Mapflow 只服务于从目的地反向演化可推导地图并沿可信工作边实际抵达
  status: shaped
  open_questions: []
origin:
  id: causal-kernel-with-legacy-detours
  kind: state
  label: 因果内核已建立，默认产品仍有旧流程岔路
  facts:
    - id: causal-kernel-present
      value: "true"
      evidence: [{ kind: command, ref: node --test tests/test_proof.mjs, strength: observed }]
    - id: default-product-core-only
      value: "false"
      evidence: [{ kind: command, ref: rg activity sdlc route-approval, strength: observed }]
    - id: full-regression-passes
      value: "false"
      evidence: [{ kind: command, ref: npm test 127-of-132, strength: observed }]
    - id: test-package-route-passes
      value: unknown
      evidence: []
destination:
  id: destination-derived-mapflow
  kind: destination
  label: Mapflow 只保留可推导地图与可信抵达闭环
  statement: Mapflow 能从目的地反推因果闭合的地图，从当前事实正向证明路线，并让人或 Agent 沿可信工作边留下证据直至审计抵达
  status: confirmed
  requires: [default-product-core-only, full-regression-passes, test-package-route-passes]
  invariants: [evidence-never-overclaims, target-workspaces-remain-unmodified]
  acceptance:
    - { id: core-surface-audit, proves: [default-product-core-only], proof: 默认 CLI、看板、安装包、文档和 Skills 只表达 Mapflow 主链 }
    - { id: deterministic-regression, proves: [full-regression-passes], proof: npm test 全部通过 }
    - { id: evolution-package-proof, proves: [test-package-route-passes], proof: 测试包沿工作边完成 audited Arrival }
boundaries:
  in_scope: [证明内核、runtime、看板、模板、Skills、行为真源、测试包和安装清单]
  out_of_scope: [发布、推送、全局安装和外部部署, 用软件工程生命周期或 Agent 编排替代通用地图]
  authorization: [不执行发布、推送、全局安装或外部写入]
nodes:

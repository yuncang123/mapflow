    prompt: 当前工作区已经成立、尚未确认或相互冲突的事实分别是什么？
    target: { kind: node, id: causal-kernel-with-legacy-detours, label: 因果内核已建立，默认产品仍有旧流程岔路, purpose: 固定四值起始事实 }

    to: core-surface-aligned
    label: 收敛默认产品到唯一主链
    purpose: 删除偏航机制并补齐五层证明语义
    status: confirmed
    question_refs: [confirm-destination-derived-mapflow]
    brief_ref: briefs/align-core-surface.md
    preconditions: [causal-kernel-present]
    effects: [default-product-core-only]
    invariants: [evidence-never-overclaims, target-workspaces-remain-unmodified]
    evidence_contract: [{ id: core-surface-audit, proves: [default-product-core-only], required: true, proof: 核心表面测试 }]
